[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlgami"
version = "0.1.0"
description = "Advisory confidence reports for LLM-written SQL. No guarantee of correctness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=27,<29",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
postgres = [
    "psycopg[binary]>=3.2",
]
bigquery = ["google-cloud-bigquery>=3.25"]  # offline only: dry runs and native reference runs in the sandbox
excel = ["openpyxl>=3.1"]  # reading a term catalogue from .xlsx; CSV needs nothing
# The compile step (fixtures + reference fingerprints) and the live fixture stage run on DuckDB
# and read a YAML config.
bundle = ["duckdb>=1.1", "pyyaml>=6"]
# Everything a shadow-mode pilot needs: the bundle, a workbook, and the doctor.
pilot = ["duckdb>=1.1", "pyyaml>=6", "openpyxl>=3.1"]
# The Hugging Face generator for the consistency stage uses only the standard library.
hf = []

[project.scripts]
sqlgami = "sqlgami.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "duckdb>=1.1",
    "pyyaml>=6.0.3",
    "pytz>=2026.6",
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlgami"]

[tool.hatch.build.targets.sdist]
include = ["src/sqlgami", "README.md", "LICENSE", "docs/adr", "examples/terms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
