rules:
  soft_delete_default: >
    Unless a question says otherwise, soft-deleted rows
    (deleted_at IS NOT NULL) are EXCLUDED from any table whose rows the
    question directly counts, lists, or aggregates. The rule is NOT
    transitive: a count of invoices does NOT additionally check the
    tenant's deleted_at; a count of memberships does NOT check the
    user's deleted_at; a count of subscription_items does NOT check
    the subscription's deleted_at. When the question text explicitly
    says "non-deleted tenants" / "non-deleted users" / similar, the
    gold applies deleted_at on that outer entity too. When both the
    outer entity and a joined entity are explicitly scoped, both get
    filtered. Tables without a deleted_at column (plans, roles,
    features, PlanFeatures, coupons, promotions, tax_jurisdictions,
    addresses, subscription_items, line_items, etc.) have no such
    filter applied at all.
  ordered_default: >
    Every question whose English text asks for order carries
    ordered: true, and its gold ORDER BY includes a deterministic
    tie-break (usually the row's primary key ASC). Row-order of the
    returned rows matters only for questions with ordered: true.
  columns_default: >
    Column names in a question are intent, not required output names.
    The validator compares row-sets by position, not by column label.
  zero_rows_default: >
    Questions of the form "For each X, return …" or "per X …" return
    one row per qualifying X, with 0 for count/SUM measures and NULL
    for other measures when nothing matches that X. Questions of the
    form "X that have …" or "X with at least one …" return only
    matching X. Gold SQL follows this rule even when the question text
    does not spell it out.
  fx_conversion: >
    When a question needs an FX conversion, the anchor date is the
    transaction date (invoice.issued_at date, payment.paid_at date, or
    a month's first day when the measure is aggregated to a month).
    The rate used is the row in billing.exchange_rates with the
    greatest rate_date on or before the anchor date, matching
    from_ccy = the source currency and to_ccy = the target currency.
    If no such row exists, the conversion rate is treated as
    1.0 (rate_e8 = 100000000). rate_e8 is scale 10^8 so
    target = source_cents * rate_e8 / 10^8. Gold computes the
    conversion per invoice (or per transaction) and truncates to
    integer cents via FLOOR, then sums; never sum first and divide
    (that would introduce rounding noise against the per-row engine
    semantics).
  refund_credit_promo_currency: >
    Refunds, credit_transactions and promotion_applications have no
    explicit currency_code column. For FX-conversion purposes assume
    they are denominated in the SAME currency as the invoice they are
    attached to; for refunds not attached to a specific invoice, assume
    USD. Converted to USD using the same fx_conversion rule above.
  rounding_default: >
    Monetary conversions and divisions use FLOOR to integer at the
    innermost possible point (per-row, before aggregation). Ratios are
    expressed as integer per-mille (×1000, floor). "Average" questions
    say explicitly whether to round and at which stage. Gold never
    returns a floating-point value where an integer is sensible.
  days_difference: >
    "Days to pay", "days to resolve" and similar are expressed as
    DATE_DIFF in days — the count of day boundaries crossed between
    two timestamps in UTC. "Within N days" means the difference ≤ N.
    A payment timestamped on the same calendar day as issued_at has
    days_to_pay = 0. Dates and timestamps are compared in UTC
    (the session is pinned to UTC). "Within 7 days" does NOT mean a
    rolling 8-day window — it means difference ≤ 7.
  usd_to_usd_passthrough: >
    FX conversions where both from_ccy and to_ccy are USD do NOT look
    up any rate; the value passes through at 1:1.
  refund_credit_bucket_date: >
    When a question aggregates refunds, credit transactions or
    promotion applications into a monthly or periodic bucket, use the
    row's OWN date column (refunds.created_at, credit_transactions.
    created_at, promotion_applications.applied_at), NOT the attached
    invoice's issued_at. The question will say explicitly when the
    invoice's month is the bucket.
  prev_before_window: >
    For a tenant/period's first appearance in the reporting window,
    the "previous period" value is NULL. Gold does not try to look up
    rows outside the window to fill prev_*. LAG/self-join on
    (previous month) therefore naturally returns NULL for the first
    row per partition.
  paid_vs_partial: >
    A question that says "paid invoices" means status='paid' only. A
    question that says "paid or partial" means status IN ('paid',
    'partial'). "Revenue" in the glossary term includes both unless
    the question specifies.
  zero_denominator: >
    When a ratio has a zero denominator, the result is NULL (not 0,
    and not an engine divide-by-zero error). Gold uses NULLIF or a
    guard in the HAVING / WHERE clause to express this.
  current_address: >
    A tenant can have at most one current address at a time (the SCD2
    structure enforces one row with effective_to IS NULL per address_id
    + tenant). If a tenant happens to have multiple current rows, the
    gold uses the row with the greatest address_id as the winner. Gold
    never joins through the whole addresses table for "current".
  active_subscription_status: >
    "Active" in English questions means ended_at IS NULL AND
    deleted_at IS NULL unless the question or glossary term explicitly
    adds a status filter. The broader glossary term active_subscription
    (which adds status IN ('active','past_due') and
    ended_at > as_of) applies only when the question says
    "active per the glossary" or uses the active_subscriptions_v view.

terms:
  active_subscription: >
    deleted_at IS NULL AND status IN ('active','past_due') AND
    (ended_at IS NULL OR ended_at > as_of).
  current_tax_rate: >
    A row in billing.tax_rates with effective_to IS NULL. Historical rows are
    kept for audit; "current" means the one row per jurisdiction with
    effective_to IS NULL.
  current_address: >
    A row in billing.addresses with effective_to IS NULL.
  mrr: >
    Monthly recurring revenue. Computed only for subscriptions on monthly
    plans (billing_interval='month'). base_price_cents is the recurring
    charge; one-time credits, adjustments and taxes are excluded from MRR.
  tenant_scope: >
    Multi-tenant isolation. Every tenant-scoped query must filter by
    tenant_id. Questions that imply an acting tenant carry a tenant field;
    questions that ask across tenants have tenant=null and the gold does
    not add a filter.
  overdue: >
    An invoice whose status='overdue'. The generator sets status
    deterministically; the question should not re-derive overdue from
    due_date.
  revenue: >
    SUM(total_cents) over invoices with status IN ('paid','partial') and
    deleted_at IS NULL. Returns are not deducted inside this suite; see
    retail suite for return-aware revenue. Questions that specify a
    single status ("paid invoices", "overdue invoices") override this
    default and use only the stated status.
  last_month: >
    In this suite, "last month" is the previous calendar month in UTC —
    e.g. for as_of 2026-06-30T00:00:00Z, last month is 2026-05-01 through
    2026-05-31 inclusive, or [2026-05-01, 2026-06-01). Trailing-30-days
    questions say so explicitly.
  tenant_timezone_bucket: >
    When a question asks for "daily/monthly in the tenant's billing
    timezone", gold converts UTC timestamps via AT TIME ZONE
    tenants.billing_timezone before truncating. DuckDB requires ICU;
    SQLite gold is null on DST zones for the periods affected.

scales:
  rate_e8: "value = rate_e8 / 1e8"
  pct_e6:  "percentage = pct_e6 / 1e6"
  unit_price_e4: "unit price in cents = unit_price_e4 / 1e4"
  money_cents: "minor units (per currency's minor_unit_scale)"
