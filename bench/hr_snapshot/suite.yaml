name: hr_snapshot
description: >
  Periodic-snapshot HR suite. One wide fact (emp_period_snapshot) with restated
  snap_dt × period_end_dt rows, pay_period_dim at B (biweekly) and W (weekly)
  frequency with period_seq and is_current_flag, hierarchy_dim with LVL 2..7 for
  both reporting and functional chains, and employee_dim with hire/term cycles.
  Exercises as-of snapshot semantics, period_seq arithmetic, orphan hierarchy
  nodes, NULL statuses, rehires, zero-headcount periods, LVL_FN gaps, and
  restatement (multiple snap_dt rows per period_end_dt where the correct answer
  always uses snap_dt = period_end_dt).

engines:
  - sqlite
  - duckdb
  - postgres

as_of: "2026-06-30"

history:
  current_ppe: "2026-06-20"            # period_seq = 0 on freq_cd='B'
  biweekly_periods: 52                 # period_seq -51..0
  earliest_period_end_dt: "2024-07-06" # 2026-06-20 minus 51*14 days
  earliest_snap_dt: "2024-07-06"       # snap_dt = period_end_dt for frozen past periods
  weekly_periods: 104
  restatement_window_days: 28          # snap_dt = period_end_dt + {0, 14, 28}

sqlite_naming:
  rule: "<schema>_<table>"
  notes: >
    hr.x -> hr_x, hr_ref.x -> hr_ref_x. No ATTACH; one database. BOOLEANs are
    stored as INTEGER 0/1 (is_current_flag). Dates as TEXT 'YYYY-MM-DD'.

types:
  dates:
    serialization: "YYYY-MM-DD"
  booleans:
    emit_as: "JSON true / false"
    storage: "BOOLEAN on Postgres/DuckDB; INTEGER 0/1 on SQLite"
  nulls:
    serialization: "JSON null"

seeds:
  - {seed: 1, profile: clean}
  - {seed: 2, profile: clean}
  - {seed: 3, profile: clean}
  - {seed: 42, profile: nasty}
  - {seed: 43, profile: nasty}
  - {seed: 44, profile: nasty}
  - {seed: 45, profile: clean}  # pooled person-id hierarchy; 12003 is a manager employee
  - {seed: 46, profile: nasty}  # pooled person-id hierarchy; 12003 is a manager employee
  - {seed: 47, profile: nasty}  # pooled; fn-only on-leave person
  - {seed: 48, profile: nasty}  # pooled; rep-side on-leave people (lvl_3_id=12003)

seed_45_46_47_48_pooling:
  rule: >
    On seeds 45, 46, 47 and 48 ONLY, hierarchy node_ids are drawn from a shared pool of
    person assoc_ids (the same assoc_ids that appear in hr.employee_dim). The reporting
    and functional chains both draw from this pool, so a single person_id can appear as
    a node in BOTH chains at potentially different levels. Employees' assoc_ids on
    these seeds span 12001..12300 (300 employees) instead of the 900001-based range
    used on other seeds. Seeds 1-3 and 42-44 are unchanged from their byte-identical
    frozen state.
  default_manager_scope:
    manager_id: 12003
    placement: >
      On seeds 45/46/47/48, 12003 is placed at reporting LVL_3 (big subtree) AND
      functional LVL_7 (single leaf). Some associates match {manager_id}=12003 only via
      the _fn chain, exposing the missing-_fn-set trap.
  mid_year_churn: >
    On seeds 45/46/47/48 under 12003's reporting subtree: 10 "long-term loyal", 10
    "recent layoffs" (term ~100-200 days ago), and 10 mid-year hires at 346-355 days
    ago. The layoffs make year-over-year growth negative on seed 45; the mid-year
    hires span the 350-vs-364-day boundary.
  seed_47_onleave: >
    On seed 47 ONLY: one of the fn-only employees (the smallest assoc_id among the 8
    fn-only matches) is pinned to hire ~3 years ago, no term_dt in hr.employee_dim,
    and status_cd='L' on the current authoritative snapshot (snap_dt = period_end_dt
    = current PPE). This person's rep-chain columns never equal {manager_id}=12003
    at any level; their only match to 12003 is lvl_7_id_fn. Exposes the precedence
    bug variant where the status filter is AND-bound to the FIRST scope disjunct
    (status != 'L' AND lvl_2_id = m OR ... OR lvl_7_id_fn = m), letting this person
    leak through on the lvl_7_id_fn disjunct.
  seed_48_onleave: >
    On seed 48 ONLY: three employees whose reporting chain has lvl_3_id = {manager_id}
    = 12003 and whose functional chain does NOT include 12003 at any level are pinned
    to hire ~3 years ago, no term_dt in hr.employee_dim, and status_cd='L' on the
    current authoritative snapshot (snap_dt = period_end_dt = current PPE). Their only
    match to 12003 is via rep-side columns (specifically lvl_3_id). Exposes gemma's
    precedence bug variant where the status filter is AND-bound to the LAST disjunct
    (... OR lvl_7_id_fn = m AND status_cd != 'L'), letting these three rep-side
    on-leave people leak through on the rep disjuncts that admit all status codes.

row_budget:
  clean_seed_1: 35149    # 156 + 1112 + 250 + 33606 + 15 + 10 + 5 (ref)
  nasty_seed_42: 35234   # 156 + 1093 + 256 + 33699 + 30 (ref totals)
  nasty_seed_44: 36750   # 156 + 1092 + 264 (250 + 8 early leavers + 6 nasty) + 35205 + 30
  clean_seed_45: 41389   # 156 + 378 + 300 + 40851 + 30 (ref totals)
  nasty_seed_46: 39772   # 156 + 373 + 301 + 39112 + 30 (ref totals)
  nasty_seed_47: 41439   # 156 + 371 + 301 + 40584 + 27 (ref totals: 12 + 10 + 5)
  nasty_seed_48: 40685   # 156 + 375 + 301 + 39826 + 27 (ref totals: 12 + 10 + 5)
  cap: 50000

session:
  timezone: UTC
  notes: >
    All dates stored and queried as calendar DATEs (no time zones). The loader
    pins session TimeZone=UTC on Postgres and DuckDB defensively.

parameters:
  style: "single-brace {name}"
  catalog:
    period_end_dt: "pay_period_dim.ppe_dt (freq_cd='B'); default '2026-06-20'"
    period_seq_from: "pay_period_dim.period_seq; default -25"
    period_seq_to: "pay_period_dim.period_seq; default 0"
    region: "hr_ref.country_region.region; default 'NorthAm'"
    country: "hr_ref.country_region.country_cd; default 'US'"
    lvl_n_id: "hierarchy_dim.node_id at that lvl; default varies"

profile_hazards:
  clean:
    - "No NULL statuses"
    - "No term_before_hire rows"
    - "Reporting and functional chains are both intact"
  nasty:
    - "~2% of snapshot rows have status_cd = NULL"
    - "One assoc_id has term_dt < hire_dt (bad row)"
    - "Functional hierarchy has ~10% LVL_6 nodes removed (gaps in _FN chain)"
    - "One zero-headcount period (status='A' rows removed for one PPE on snap_dt=PPE)"
    - "One associate's lvl_5_id points to node_id 999999 (orphan in hierarchy_dim)"
    - "One extra bad associate (999001) with term before hire"
    - "Some restated rows carry a corrected status_cd (A↔L flip) vs their snap=PPE row"
    - "One restated row carries a corrected job_grp vs the snap=PPE row"

views:
  - hr.current_snapshot_v
  - hr.new_hires_last_26p_v
  - hr.active_headcount_by_period_v
  - hr.turnover_26p_v
  - hr.vol_turnover_26p_v
  - hr.invol_turnover_26p_v
  - hr.orphaned_hierarchy_v
  - hr.active_at_current_period_by_region_v

materialized_views:
  - hr.monthly_headcount_mv  # Postgres only; loader refreshes after load.

snapshot_semantics:
  rule: >
    For any (assoc_id, period_end_dt) there can be up to 3 snap_dt rows at
    snap_dt ∈ {period_end_dt, period_end_dt+14d, period_end_dt+28d}. Each later
    snap_dt restates the earlier one with newly-known facts. The "correct" row
    for reading period_end_dt is always snap_dt = period_end_dt (the snapshot
    taken at the period's close). Gold uses snap_dt = period_end_dt by default.
    Treating a later restatement as the authoritative row is a gold bug.

# How sqlgami is configured for this suite (the owner's real-world setup). benchkit passes
# these to Scorer(...) when it evaluates the suite.
sqlgami:
  snapshot_columns:
    hr.emp_period_snapshot: snap_dt
  required_predicates:
    - name: hierarchy_access
      description: >
        Every read of the fact is scoped to a manager's subtree: one OR chain over BOTH the
        reporting levels (lvl_2_id ... lvl_7_id) and the functional levels (_fn). A query that
        checks only one chain misses people reachable through the other.
      tables: [hr.emp_period_snapshot]
      columns: [lvl_2_id, lvl_3_id, lvl_4_id, lvl_5_id, lvl_6_id, lvl_7_id,
                lvl_2_id_fn, lvl_3_id_fn, lvl_4_id_fn, lvl_5_id_fn, lvl_6_id_fn, lvl_7_id_fn]
      match: or_chain
      severity: high
  # Live-check fixtures. sqlgami builds one small in-memory DuckDB per profile at compile time
  # and reruns the host's references on it during scoring. The study (sherlock, fixtures_study/)
  # showed a 92-emp × 27-biweekly-period × 3-snap cut (~6,981 rows on seed 47, ~3-10k on the
  # six source seeds) runs every holdout gold query in < 20 ms with a 5 ms average on DuckDB
  # in-memory, well under the 50 ms live budget, and preserves 36/41 bug divergences on s47
  # (union across six per-seed fixtures covers 41/41 planted bugs). The two sides below:
  #   * subsample: predicates applied by `benchkit compile --from-seeds` when cutting the
  #     generated seed databases down to a bundle fixture.
  #   * rules below (seed/profiles/rows/.../critical_rows): the recipe for sqlgami's own
  #     synthetic FixtureRules path, so a live build without the seed DBs still carries the
  #     critical adversarial rows that every planted bug needs.
  fixtures:
    # --- subsample recipe for benchkit compile --from-seeds -------------------------
    subsample:
      hr.pay_period_dim: "freq_cd <> 'B' OR period_seq BETWEEN -27 AND 1"
      hr.employee_dim: >-
        assoc_id IN (SELECT s.assoc_id FROM hr.emp_period_snapshot s JOIN hr.pay_period_dim p ON p.ppe_dt = s.period_end_dt AND p.freq_cd = 'B'
        WHERE s.snap_dt = s.period_end_dt AND (12003 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)
        OR 52002 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)))
      hr.emp_period_snapshot: >-
        period_end_dt IN (SELECT ppe_dt FROM hr.pay_period_dim WHERE freq_cd = 'B' AND period_seq BETWEEN -27 AND 1)
        AND assoc_id IN (SELECT s.assoc_id FROM hr.emp_period_snapshot s JOIN hr.pay_period_dim p ON p.ppe_dt = s.period_end_dt AND p.freq_cd = 'B'
        WHERE s.snap_dt = s.period_end_dt AND (12003 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)
        OR 52002 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)))

    # --- synthetic FixtureRules (sqlgami.fixtures.FixtureRules.from_dict) -----------
    seed: 47
    profiles: [clean, nulls, duplicates, ties, sparse, edges]
    rows:
      hr.pay_period_dim: 156            # 52 biweekly + 104 weekly
      hr.hierarchy_dim: 400             # both chains, lvls 2..7 pooled
      hr.employee_dim: 92               # minimum in-scope cohort from the study
      hr.emp_period_snapshot: 6981      # 92 emps × 27 B-periods × ~2.8 snaps
    values:
      hr.emp_period_snapshot.status_cd: [A, L, T, R, U]
      hr.emp_period_snapshot.assoc_type: [FTE, Contractor, Intern]
      hr.emp_period_snapshot.region: [NorthAm, EMEA, APAC, LATAM]
      hr.emp_period_snapshot.segment: [Enterprise, MidMarket, SMB]
      hr.emp_period_snapshot.country: [US, GB, IN, JP, DE, FR]
      hr.emp_period_snapshot.job_grp: [ENG, DAT, DES, OPS, SAL]
      hr.pay_period_dim.freq_cd: [B, W]
    null_rate:
      hr.emp_period_snapshot.status_cd: 0.02   # the "~2% NULL status" feature
      hr.emp_period_snapshot.assoc_type: 0.10  # the "10% NULL employment type" feature
      hr.emp_period_snapshot.invol_exit_ind: 0.0   # NOT NULL on turnover rows; let generator set
      hr.employee_dim.term_dt: 0.6                 # most employees are not terminated
    dates:
      start: "2024-07-06"    # earliest period_end_dt in the suite
      end: "2026-07-20"      # covers snap_dt = PPE + 28d for the current period
    params:
      manager_id: [12003, 52002]
    param_columns:
      manager_id:
        # Both reporting-chain and functional-chain columns so the fixture carries
        # the both-chain coverage the required_predicates rule tests.
        - hr.emp_period_snapshot.lvl_3_id
        - hr.emp_period_snapshot.lvl_7_id_fn
    # Rows that MUST exist verbatim so every planted bug has a leak point in the fixture.
    # These are the "critical aids" from the fixtures_study: seed-47's fn-only on-leave
    # person (12028), seed-48's three rep-side on-leave injectees (12170/12221/12236),
    # and the nasty-profile bad-row 999001. One authoritative-snap row per on-leave
    # person at the current PPE (2026-06-20) with the chain column that makes the
    # AND/OR precedence bug variants leak.
    critical_rows:
      hr.employee_dim:
        # fn-only on-leave (seed 47 cohort): hire 3y ago, no term, matches 12003 only via fn chain
        - {assoc_id: 12028, given_name: FnOnly, family_name: OnLeave, hire_dt: "2023-06-20", term_dt: null}
        # rep-side on-leave (seed 48 cohort): lvl_3_id = 12003, no fn match, status L at current PPE
        - {assoc_id: 12170, given_name: RepSide, family_name: OnLeaveA, hire_dt: "2023-06-20", term_dt: null}
        - {assoc_id: 12221, given_name: RepSide, family_name: OnLeaveB, hire_dt: "2023-06-20", term_dt: null}
        - {assoc_id: 12236, given_name: RepSide, family_name: OnLeaveC, hire_dt: "2023-06-20", term_dt: null}
        # nasty "term before hire" bad row: exposes future arithmetic bugs on tenure
        - {assoc_id: 999001, given_name: Bad, family_name: Row, hire_dt: "2026-01-15", term_dt: "2025-06-20"}
      hr.emp_period_snapshot:
        # 12028 — fn-only (lvl_7_id_fn=12003), status_cd=L, authoritative current PPE
        - {snap_dt: "2026-06-20", period_end_dt: "2026-06-20", assoc_id: 12028,
           hire_dt: "2023-06-20", term_dt: null, status_cd: L,
           invol_exit_ind: null, new_hire_ind: 0, exit_filt_ind: 0, turn_filt_ind: 0,
           region: NorthAm, segment: Enterprise, country: US, job_grp: ENG, assoc_type: FTE,
           lvl_2_id: null, lvl_3_id: null, lvl_4_id: null, lvl_5_id: null, lvl_6_id: null, lvl_7_id: null,
           lvl_2_id_fn: null, lvl_3_id_fn: null, lvl_4_id_fn: null, lvl_5_id_fn: null, lvl_6_id_fn: null, lvl_7_id_fn: 12003}
        # 12170 — rep-side (lvl_3_id=12003), no fn match, status_cd=L at current PPE
        - {snap_dt: "2026-06-20", period_end_dt: "2026-06-20", assoc_id: 12170,
           hire_dt: "2023-06-20", term_dt: null, status_cd: L,
           invol_exit_ind: null, new_hire_ind: 0, exit_filt_ind: 0, turn_filt_ind: 0,
           region: NorthAm, segment: MidMarket, country: US, job_grp: DAT, assoc_type: FTE,
           lvl_2_id: null, lvl_3_id: 12003, lvl_4_id: null, lvl_5_id: null, lvl_6_id: null, lvl_7_id: null,
           lvl_2_id_fn: null, lvl_3_id_fn: null, lvl_4_id_fn: null, lvl_5_id_fn: null, lvl_6_id_fn: null, lvl_7_id_fn: null}
        # 12221 — rep-side, no fn match
        - {snap_dt: "2026-06-20", period_end_dt: "2026-06-20", assoc_id: 12221,
           hire_dt: "2023-06-20", term_dt: null, status_cd: L,
           invol_exit_ind: null, new_hire_ind: 0, exit_filt_ind: 0, turn_filt_ind: 0,
           region: EMEA, segment: SMB, country: GB, job_grp: DES, assoc_type: FTE,
           lvl_2_id: null, lvl_3_id: 12003, lvl_4_id: null, lvl_5_id: null, lvl_6_id: null, lvl_7_id: null,
           lvl_2_id_fn: null, lvl_3_id_fn: null, lvl_4_id_fn: null, lvl_5_id_fn: null, lvl_6_id_fn: null, lvl_7_id_fn: null}
        # 12236 — rep-side, no fn match
        - {snap_dt: "2026-06-20", period_end_dt: "2026-06-20", assoc_id: 12236,
           hire_dt: "2023-06-20", term_dt: null, status_cd: L,
           invol_exit_ind: null, new_hire_ind: 0, exit_filt_ind: 0, turn_filt_ind: 0,
           region: APAC, segment: Enterprise, country: IN, job_grp: OPS, assoc_type: FTE,
           lvl_2_id: null, lvl_3_id: 12003, lvl_4_id: null, lvl_5_id: null, lvl_6_id: null, lvl_7_id: null,
           lvl_2_id_fn: null, lvl_3_id_fn: null, lvl_4_id_fn: null, lvl_5_id_fn: null, lvl_6_id_fn: null, lvl_7_id_fn: null}
