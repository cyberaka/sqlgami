name: hr_snapshot
description: >
  Periodic-snapshot HR suite. One wide fact (emp_period_snapshot) with restated
  snap_dt × period_end_dt rows, pay_period_dim at B (biweekly) and W (weekly)
  frequency with period_seq and is_current_flag, hierarchy_dim with LVL 2..7 for
  both reporting and functional chains, and employee_dim with hire/term cycles.
  Exercises as-of snapshot semantics, period_seq arithmetic, orphan hierarchy
  nodes, NULL statuses, rehires, zero-headcount periods, LVL_FN gaps, and
  restatement (multiple snap_dt rows per period_end_dt where the correct answer
  always uses snap_dt = period_end_dt).

engines:
  - sqlite
  - duckdb
  - postgres

as_of: "2026-06-30"

history:
  current_ppe: "2026-06-20"            # period_seq = 0 on freq_cd='B'
  biweekly_periods: 52                 # period_seq -51..0
  earliest_period_end_dt: "2024-07-06" # 2026-06-20 minus 51*14 days
  earliest_snap_dt: "2024-07-06"       # snap_dt = period_end_dt for frozen past periods
  weekly_periods: 104
  restatement_window_days: 28          # snap_dt = period_end_dt + {0, 14, 28}

sqlite_naming:
  rule: "<schema>_<table>"
  notes: >
    hr.x -> hr_x, hr_ref.x -> hr_ref_x. No ATTACH; one database. BOOLEANs are
    stored as INTEGER 0/1 (is_current_flag). Dates as TEXT 'YYYY-MM-DD'.

types:
  dates:
    serialization: "YYYY-MM-DD"
  booleans:
    emit_as: "JSON true / false"
    storage: "BOOLEAN on Postgres/DuckDB; INTEGER 0/1 on SQLite"
  nulls:
    serialization: "JSON null"

seeds:
  - {seed: 1, profile: clean}
  - {seed: 2, profile: clean}
  - {seed: 3, profile: clean}
  - {seed: 42, profile: nasty}
  - {seed: 43, profile: nasty}
  - {seed: 44, profile: nasty}
  - {seed: 45, profile: clean}  # pooled person-id hierarchy; 12003 is a manager employee
  - {seed: 46, profile: nasty}  # pooled person-id hierarchy; 12003 is a manager employee

seed_45_46_pooling:
  rule: >
    On seeds 45 and 46 ONLY, hierarchy node_ids are drawn from a shared pool of person
    assoc_ids (the same assoc_ids that appear in hr.employee_dim). The reporting and
    functional chains both draw from this pool, so a single person_id can appear as a
    node in BOTH chains at potentially different levels. Employees' assoc_ids on these
    seeds span 12001..12300 (300 employees) instead of the 900001-based range used on
    other seeds. Seeds 1-3 and 42-44 are unchanged from their byte-identical frozen state.
  default_manager_scope:
    manager_id: 12003
    placement: >
      On seeds 45/46, 12003 is placed at reporting LVL_3 (big subtree) AND functional
      LVL_7 (single leaf). Some associates match {manager_id}=12003 only via the _fn
      chain, exposing the missing-_fn-set trap.
  mid_year_churn: >
    On seeds 45/46 under 12003's reporting subtree: 10 "long-term loyal", 10 "recent
    layoffs" (term ~100-200 days ago), and 10 mid-year hires at 346-355 days ago. The
    layoffs make year-over-year growth negative on seed 45; the mid-year hires span the
    350-vs-364-day boundary.

row_budget:
  clean_seed_1: 35149    # 156 + 1112 + 250 + 33606 + 15 + 10 + 5 (ref)
  nasty_seed_42: 35234   # 156 + 1093 + 256 + 33699 + 30 (ref totals)
  nasty_seed_44: 36750   # 156 + 1092 + 264 (250 + 8 early leavers + 6 nasty) + 35205 + 30
  clean_seed_45: 41389   # 156 + 378 + 300 + 40851 + 30 (ref totals)
  nasty_seed_46: 39772   # 156 + 373 + 301 + 39112 + 30 (ref totals)
  cap: 50000

session:
  timezone: UTC
  notes: >
    All dates stored and queried as calendar DATEs (no time zones). The loader
    pins session TimeZone=UTC on Postgres and DuckDB defensively.

parameters:
  style: "single-brace {name}"
  catalog:
    period_end_dt: "pay_period_dim.ppe_dt (freq_cd='B'); default '2026-06-20'"
    period_seq_from: "pay_period_dim.period_seq; default -25"
    period_seq_to: "pay_period_dim.period_seq; default 0"
    region: "hr_ref.country_region.region; default 'NorthAm'"
    country: "hr_ref.country_region.country_cd; default 'US'"
    lvl_n_id: "hierarchy_dim.node_id at that lvl; default varies"

profile_hazards:
  clean:
    - "No NULL statuses"
    - "No term_before_hire rows"
    - "Reporting and functional chains are both intact"
  nasty:
    - "~2% of snapshot rows have status_cd = NULL"
    - "One assoc_id has term_dt < hire_dt (bad row)"
    - "Functional hierarchy has ~10% LVL_6 nodes removed (gaps in _FN chain)"
    - "One zero-headcount period (status='A' rows removed for one PPE on snap_dt=PPE)"
    - "One associate's lvl_5_id points to node_id 999999 (orphan in hierarchy_dim)"
    - "One extra bad associate (999001) with term before hire"
    - "Some restated rows carry a corrected status_cd (A↔L flip) vs their snap=PPE row"
    - "One restated row carries a corrected job_grp vs the snap=PPE row"

views:
  - hr.current_snapshot_v
  - hr.new_hires_last_26p_v
  - hr.active_headcount_by_period_v
  - hr.turnover_26p_v
  - hr.vol_turnover_26p_v
  - hr.invol_turnover_26p_v
  - hr.orphaned_hierarchy_v
  - hr.active_at_current_period_by_region_v

materialized_views:
  - hr.monthly_headcount_mv  # Postgres only; loader refreshes after load.

snapshot_semantics:
  rule: >
    For any (assoc_id, period_end_dt) there can be up to 3 snap_dt rows at
    snap_dt ∈ {period_end_dt, period_end_dt+14d, period_end_dt+28d}. Each later
    snap_dt restates the earlier one with newly-known facts. The "correct" row
    for reading period_end_dt is always snap_dt = period_end_dt (the snapshot
    taken at the period's close). Gold uses snap_dt = period_end_dt by default.
    Treating a later restatement as the authoritative row is a gold bug.

# How sqlgami is configured for this suite (the owner's real-world setup). benchkit passes
# these to Scorer(...) when it evaluates the suite.
sqlgami:
  snapshot_columns:
    hr.emp_period_snapshot: snap_dt
  required_predicates:
    - name: hierarchy_access
      description: >
        Every read of the fact is scoped to a manager's subtree: an OR chain over the
        reporting levels (lvl_2_id ... lvl_7_id) or over the functional levels (_fn).
      tables: [hr.emp_period_snapshot]
      groups:
        - [lvl_2_id, lvl_3_id, lvl_4_id, lvl_5_id, lvl_6_id, lvl_7_id]
        - [lvl_2_id_fn, lvl_3_id_fn, lvl_4_id_fn, lvl_5_id_fn, lvl_6_id_fn, lvl_7_id_fn]
      match: or_chain
      severity: high
