# Subsample predicates for benchkit compile --from-seeds (the fixture study's recipe): the
# in-scope employees of the questions' managers, 27 biweekly periods plus the weekly rows.
subsample:
  hr.pay_period_dim: "freq_cd <> 'B' OR period_seq BETWEEN -27 AND 1"
  hr.employee_dim: >-
    assoc_id IN (SELECT s.assoc_id FROM hr.emp_period_snapshot s JOIN hr.pay_period_dim p ON p.ppe_dt = s.period_end_dt AND p.freq_cd = 'B'
    WHERE s.snap_dt = s.period_end_dt AND (12003 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)
    OR 52002 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)))
  hr.emp_period_snapshot: >-
    period_end_dt IN (SELECT ppe_dt FROM hr.pay_period_dim WHERE freq_cd = 'B' AND period_seq BETWEEN -27 AND 1)
    AND assoc_id IN (SELECT s.assoc_id FROM hr.emp_period_snapshot s JOIN hr.pay_period_dim p ON p.ppe_dt = s.period_end_dt AND p.freq_cd = 'B'
    WHERE s.snap_dt = s.period_end_dt AND (12003 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)
    OR 52002 IN (s.lvl_2_id, s.lvl_3_id, s.lvl_4_id, s.lvl_5_id, s.lvl_6_id, s.lvl_7_id, s.lvl_2_id_fn, s.lvl_3_id_fn, s.lvl_4_id_fn, s.lvl_5_id_fn, s.lvl_6_id_fn, s.lvl_7_id_fn)))
