# hr_snapshot data dictionary — what the business terms in questions mean.
# This describes columns and concepts; it does not spell out how to write the query.

definitions:
  my_organisation:
    meaning: >
      "My organisation" for a manager scope is every associate whose reporting-chain columns
      (lvl_2_id through lvl_7_id) include the manager's node, OR whose functional-chain columns
      (lvl_2_id_fn through lvl_7_id_fn) include it. A manager appears at any reporting or
      functional level. The manager's own row is not part of "my organisation" unless their
      own chain columns include them.

  pay_period:
    meaning: >
      Unless a question explicitly says "weekly", a pay period means a biweekly period —
      pay_period_dim rows with freq_cd = 'B'.

  current_pay_period:
    meaning: >
      The single biweekly pay period whose is_current_flag is TRUE. Business questions phrased
      around "the current period" refer to this.

  last_n_pay_periods:
    meaning: >
      A window counted back from the current biweekly pay period, using period_seq. For
      example "the last 13 pay periods" spans today's period and the 12 biweekly periods
      before it; "the last 26 pay periods" spans today and the 25 before. In period_seq
      terms the window is -(N-1) through 0 inclusive, i.e. N biweekly periods ending at
      the current one.

  n_pay_periods_ago:
    meaning: >
      The single biweekly pay period exactly N periods before the current one, i.e. the
      period at period_seq = -N. This is distinct from "the last N pay periods", which is
      a window of N periods ending at the current one. So "the pay period 26 periods ago"
      means the single period at period_seq = -26 (one period older than the start of
      "the last 26 pay periods"). "A year ago" means 26 biweekly periods ago by the same
      rule.

  n_to_m_pay_periods_ago:
    meaning: >
      A range of biweekly pay periods from N periods ago through M periods ago, inclusive
      (N ≤ M). In period_seq terms the range is period_seq BETWEEN -M AND -N. For
      example "the 6 to 25 pay-periods-ago window" is period_seq BETWEEN -25 AND -6, 20
      consecutive biweekly periods. The longer phrase wins over the generic "N pay
      periods ago", so it does not misfire as a single-period reference.

  trailing_moving_average:
    meaning: >
      A trailing window frame on an already-ordered series: the current row and the N-1
      biweekly periods before it (N periods total). In SQL window-frame terms that is
      ROWS BETWEEN (N-1) PRECEDING AND CURRENT ROW over ORDER BY period_seq. Averaging
      over fewer than N available periods at the start of the series is permitted — the
      frame just includes whatever rows exist.

  authoritative_snapshot:
    meaning: >
      Each biweekly pay period can be snapshotted more than once as later facts become known.
      A period's authoritative snapshot is the one taken on its own period end date (snap_dt
      equal to the period's ppe_dt).

  new_hire:
    meaning: >
      An associate whose snapshot row carries new_hire_ind = 1. A new hire is counted in a
      window if their hire date (hire_dt) falls inside that window's pay periods.

  authoritative_hire_and_term_dates:
    meaning: >
      hr.employee_dim is the system of record for an associate's hire date and termination
      date. EVERY use of hire_dt — whether for a hire-vs-term comparison (e.g. "terminated
      within N days of hire") OR for a hire-date window check (e.g. "a new hire is counted
      in a window if their hire_dt falls inside that window's pay periods") OR for tenure
      ranking OR anything else — reads hire_dt from hr.employee_dim. The same holds for
      term_dt. The snapshot's own hire_dt and term_dt columns reflect only what was known
      at that period's close and MUST NOT be used as the authoritative value, even when
      today's data happens to agree with hr.employee_dim.

  event_month_bucketing:
    meaning: >
      When counts are reported per calendar month (e.g. monthly new hires, monthly voluntary
      turnover), the month a new hire falls in is the month of hr.employee_dim.hire_dt, and
      the month a voluntary leaver falls in is the month of hr.employee_dim.term_dt. The
      pay-period month of the snapshot row that carries new_hire_ind = 1 or
      turn_filt_ind = 1 is NOT the bucketing key — a new_hire_ind flag persists across the
      three ~weekly restated snapshots the period emits, and a turnover row's period_end_dt
      is the pay period that first carries the departure, not the departure date itself.
      Each associate is counted exactly once in their event month.

  ninety_day_new_hire_turnover:
    meaning: >
      Among new hires in a given window, the portion whose term_dt is within 90 calendar days
      of their hire_dt. Reported in basis points as the attrition rate over new-hire count,
      NULL when there are no new hires in the window.

  one_eighty_day_new_hire_turnover:
    meaning: >
      Among new hires in a given window, the portion whose term_dt is within 180 calendar
      days of their hire_dt. Reported in basis points.

  annual_turnover:
    meaning: >
      For a window of the last 26 pay periods, the number of distinct associates with a
      turnover row (turn_filt_ind = 1) on the authoritative snapshot, divided by the active
      headcount at the start of the window. Reported in basis points. An overall rate
      across groups is total leavers over total headcount, not an average of the groups'
      rates.

  voluntary_vs_involuntary_split:
    meaning: >
      A turnover row with invol_exit_ind = 0 is VOLUNTARY; invol_exit_ind = 1 is INVOLUNTARY;
      NULL invol_exit_ind on a turnover row is an UNKNOWN bucket, reported separately from
      voluntary and involuntary.

  active:
    meaning: >
      An authoritative snapshot row is active when status_cd = 'A'. NULL status_cd is
      unknown, not active. 'L' (Leave), 'T' (Terminated), 'R' (Retired), 'U' (Unknown) are
      not active.

  on_leave:
    meaning: >
      An authoritative snapshot row is on leave when status_cd = 'L'. NULL status_cd is
      unknown (not on leave); every other status is not on leave either. Phrased in the
      negative, "not on leave" covers all rows where status_cd is NOT 'L', INCLUDING rows
      where status_cd is NULL.

  year_over_year_growth:
    meaning: >
      Year-over-year change in a count, expressed as basis points of the anchor value:
      (current - prior) × 10000 / prior, floored (rounded down, toward negative infinity)
      to an integer. The prior anchor is the count 26 biweekly pay periods ago (see
      n_pay_periods_ago), i.e. the single period at period_seq = -26. The result is NULL
      when the prior anchor count is 0.

  headcount:
    meaning: >
      The distinct count of in-scope active associates at a pay period.

  top_dense_ranks:
    meaning: >
      "The top N ranks" of an ordered measure uses dense ranking — ties at a
      rank are kept together and no rank is skipped when a tie extends across
      several rows. A question asking for "the top N ranks" returns every row
      whose dense rank is N or better, including every row that ties at those
      ranks and the rows those ties carry into when they span across a rank
      boundary. Equivalent SQL: DENSE_RANK() over the ordering, filtered to
      rank <= N.

  basis_points:
    meaning: >
      A rate expressed as an integer in ten-thousandths. 1.25% = 125 basis points; 50% = 5000.
      Basis points are floored (rounded down, toward negative infinity) to an integer, not
      rounded. For negative values, -0.5% is -51 basis points, not -50.

  deleted_at_defaults:
    meaning: >
      There is no deleted_at column in this suite. A terminated associate (status 'T') is
      not a soft-delete and still appears on authoritative snapshots.

  employment_type:
    meaning: >
      An associate's employment type: 'FTE' (full-time employee), 'Contractor', or
      'Intern'. An associate whose employment type is unknown is recorded with no value
      (NULL) rather than one of these labels. "Non-contractor" or "not a contractor"
      includes associates whose employment type is NULL — they are not contractors.

  calendar_month_window_anchored_at_current_ppe:
    meaning: >
      A rolling window of N calendar months anchored at the current biweekly
      pay-period end. "The last N calendar months" is the set of month-start
      dates from DATE_TRUNC(DATE_SUB(current_ppe, INTERVAL (N-1) MONTH), MONTH)
      through DATE_TRUNC(current_ppe, MONTH) inclusive. The anchor month is
      kept in full — a partial current month (month-start through current_ppe)
      is one bucket, not pro-rated or dropped. Zero-activity months inside the
      window are still emitted with zero counts.

  percentage_point_tolerance_vs_leader:
    meaning: >
      A "within T percentage points of the leading X" filter compares the
      UNROUNDED share values: a row survives when its unrounded share plus T
      is at least the maximum unrounded share. The displayed share
      (ROUND(share, 2) NUMERIC) is a presentation-side column and is NOT the
      comparison key; rounding before the filter would admit rows that are
      strictly more than T percentage points below the leader after a tiny
      rounding gap.

  cap_n_newest_members:
    meaning: >
      A "cap N newest members" projection returns the N most-recent members,
      ordered by hire_dt DESC and breaking ties on assoc_id ascending. The
      cap is a LIMIT inside the ARRAY_AGG (or an equivalent row-level TOP-N),
      not a post-aggregation slice: if a node has more than N members, the
      N oldest-by-hire are dropped and the N most recent remain. Two members
      with the same hire_dt tie by assoc_id ascending.

  fallback_anchor_period:
    meaning: >
      When a window-end anchor is "the current biweekly pay-period end, or
      the prior pay-period end when the current one is empty under this
      manager", the window end and the window start both shift by one period
      together: period_seq = 0 → -(n-1) normally, period_seq = -1 → -n when
      the fallback triggers. The fallback trigger is "no ACTIVE in-scope row
      at the anchor"; a period where the manager has only non-active rows
      counts as empty and the anchor rolls back.

  in_scope_segments:
    meaning: >
      The in-scope segment set for my organisation is the DISTINCT set of
      eps.segment values on the current-period authoritative snapshot rows
      whose both-chains predicate matches the manager AND status_cd = 'A'.
      A segment where the manager currently has zero active associates is
      NOT in scope, even if historical rows under that manager had that
      segment. The set is captured once at the anchor and held constant
      across the rest of the query.

  segment_share:
    meaning: >
      The segment share at a given anchor is (segment_active_n * 100.0) /
      SUM(segment_active_n) OVER (), expressed as a percentage. The
      denominator is the manager-scoped total active headcount for the
      anchor; a segment whose active count is 0 contributes 0 to the sum but
      yields NULL when SAFE_DIVIDE'd by 0 (avoid when total is 0). The
      displayed share is ROUND(share, 2) rendered as NUMERIC.

  segment_rank:
    meaning: >
      Segment rank orders segments by active headcount DESC using RANK()
      (not DENSE_RANK) so a tie for 1st yields 1, 1, 3 rather than 1, 1, 2.
      Ties on the active count carry the next rank forward by the number of
      tied segments. A "top N ranks" filter on segment rank keeps every row
      whose rank is ≤ N, including each tied row at those ranks.

  zero_filled_window:
    meaning: >
      A window-anchored time series must emit every expected bucket in the
      range even when no source row contributes. Zero-fill is a LEFT JOIN
      from the grid of expected buckets (months from GENERATE_DATE_ARRAY,
      biweekly periods from pay_period_dim, lvl_3 × period CROSS JOINs, …)
      to the aggregated source, projecting IFNULL(count, 0). The ordering
      key of the grid is the sort key of the output; nothing is dropped for
      having zero activity.

  iso_week:
    meaning: >
      An ISO week starts on Monday (ISO 8601). "Which ISO week a date is in"
      is DATE_TRUNC(dt, ISOWEEK) in BigQuery or DATE_TRUNC('isoweek', dt) in
      DuckDB, both of which return the Monday on or before dt. The ISO week
      number is EXTRACT(ISOWEEK FROM dt); it may be 1 in late December when
      the Thursday of that week falls in the next ISO year, and 52 or 53 in
      early January.

  tenure_in_iso_weeks:
    meaning: >
      Tenure in ISO weeks between hire_dt and an anchor is DATE_DIFF(anchor,
      hire_dt, ISOWEEK) in BigQuery — the count of ISO-week boundaries
      crossed. It is NOT FLOOR(days / 7); a Sunday-to-Monday boundary jump
      counts as one ISO week even though the span is one day. The hire_dt
      used here is authoritative (hr.employee_dim.hire_dt, per
      authoritative_hire_and_term_dates).

  chain_level_decomposition:
    meaning: >
      A "chain and level decomposition" of the roster splits every in-scope
      associate into (chain, lvl) buckets for each of their 12 chain-level
      columns (reporting lvl_2_id .. lvl_7_id and functional lvl_2_id_fn ..
      lvl_7_id_fn). An associate appears in each (chain, lvl) bucket where
      the manager's node is on their chain at that level, and may appear in
      multiple buckets if the manager sits on their chain at more than one
      level. Counting with COUNT(DISTINCT assoc_id) keeps each associate
      once per (chain, lvl) but not across buckets.

  lvl_3_node:
    meaning: >
      A lvl_3 node is an identifier appearing in emp_period_snapshot.lvl_3_id
      (the reporting chain's level-3 slot). Its name is hr.hierarchy_dim
      .node_name joined on node_id = lvl_3_id with hierarchy_kind =
      'reporting' and lvl = 3. The functional chain uses lvl_3_id_fn; where
      a question says just "lvl_3 node" without "functional", it means the
      reporting chain. A NULL lvl_3_id means the snapshot row has no
      lvl_3-level reporting node and the row is excluded from lvl_3
      aggregations.
